name: 2D game validation
on:
  push:
    branches: [main, feature/2d-ember-dungeon]
    paths: ['dist/2d/**','tests/2d-*.mjs','.github/workflows/check-2d.yml','package.json']
  pull_request:
    paths: ['dist/2d/**','tests/2d-*.mjs','.github/workflows/check-2d.yml','package.json']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks and pure game rules
        run: |
          node --check dist/2d/core.js
          node --check dist/2d/game.js
          node --check dist/2d/systems.js
          node --check dist/2d/boss-loot.js
          node --check dist/2d/equipment-icons.js
          node --check dist/2d/travel.js
          node --check dist/2d/crafting.js
          node --check dist/2d/mage-portrait.js
          node --check dist/2d/pixel-mage-demo.js
          node --check dist/2d/encounters.js
          node --check dist/2d/spell-vfx.js
          node --check dist/2d/dungeon-detail.js
          node --check dist/2d/fx.js
          node --check dist/2d/equipment-catalog.js
          node --check dist/2d/classes.js
          node --check dist/2d/class-skills.js
          node --check dist/2d/builds.js
          node --check dist/2d/balance.js
          node --check dist/2d/naming.js
          node --check dist/2d/sprite-data.js
          node --check dist/2d/monsters.js
          node --check dist/2d/class-catalog.js
          node --check dist/2d/hero-select.js
          node --check dist/2d/legendary.js
          node --check dist/2d/motion.js
          node --check dist/2d/progression.js
          node --check dist/2d/skill-icons.js
          node --check dist/2d/storage.js
          node --check dist/2d/ui-icons.js
          node --test tests/2d-core.test.mjs tests/2d-systems.test.mjs tests/2d-boss-live.test.mjs tests/2d-v032.test.mjs tests/2d-v033.test.mjs tests/2d-demo-mage-motion.test.mjs tests/2d-v036.test.mjs tests/2d-v040.test.mjs tests/2d-v041.test.mjs tests/2d-v050.test.mjs tests/2d-v051.test.mjs tests/2d-v060.test.mjs tests/2d-v070.test.mjs tests/2d-v072.test.mjs tests/2d-v073.test.mjs
      - name: Browser runtime smoke tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei
          npm install --no-save --package-lock=false playwright-core@1.56.1
          SCREENSHOT_FOR_REVIEW=1 node tests/2d-browser.test.mjs
