name: Deploy GitHub Pages
on:
  push:
    branches: [main, feature/2d-maze-topology-f1]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript and model assets
        run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify live 2D page responds
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 "https://templehao.github.io/Diablo/2d/?deploy=$GITHUB_SHA" -o /tmp/2d.html && grep -q "v0.3.5" /tmp/2d.html; then
              exit 0
            fi
            sleep 5
          done
          echo "Live 2D page did not expose the deployed v0.3.5 HTML" >&2
          exit 1
      - name: Verify live Enter Dungeon interaction
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://templehao.github.io/Diablo/2d/?verify='+Date.now(),{waitUntil:'networkidle'});
            assert.equal(response.status(),200);
            assert.match(await page.locator('.version').innerText(),/v0\.3\.5/);
            assert.equal(await page.locator('#scrim').isVisible(),true);
            await page.click('#modal-primary');
            await page.waitForTimeout(350);
            assert.equal(await page.locator('#scrim').isVisible(),false,'Enter Dungeon button did not enter the live game');
            assert.ok(await page.locator('#game').evaluate(el=>el.width>0&&el.height>0),'live game canvas is not initialized');
            assert.deepEqual(errors,[],'live page JS exceptions: '+errors.join(' | '));
            console.log('LIVE_2D_ENTRY_OK');
          } finally {
            await browser.close();
          }
          NODE
