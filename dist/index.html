<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11151b"><title>余烬法师 · 灰烬地窟</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="world" aria-label="3D 地下城"></canvas><div class="vignette"></div>
<header><div class="brand"><span class="sigil">✧</span><div>余烬法师<small>EMBER MAGE · 原型 0.2.0</small></div></div><nav><button id="hero">人物</button><button id="bag">装备 <span> B </span></button></nav></header>
<section class="quest"><small>第一章 / 灰烬地窟</small><h2 id="objective">净化徘徊者</h2><p id="progress">击败守卫，唤醒地窟领主</p></section>
<div id="notice" role="status"></div><section id="bossbar" hidden><span>灰烬领主</span><div><i></i></div></section>
<footer><div class="portrait">♜</div><div class="vitals"><div><strong>余烬学徒</strong><span id="level">Lv. 1</span></div><div class="bar hp"><i id="hp"></i><label id="hptext"></label></div><div class="bar mana"><i id="mana"></i><label id="manatext"></label></div><div class="bar xp"><i id="xp"></i></div></div><div class="skills"><button data-skill="fire"><b>✹</b><span>火球</span><small>按住 / 1</small><em></em></button><button data-skill="ice"><b>❄</b><span>冰霜新星</span><small>2</small><em></em></button><button data-skill="blink"><b>ϟ</b><span>闪现</span><small>空格</small><em></em></button><button data-skill="heal"><b>✚</b><span>治疗药水</span><small>3</small><em></em></button></div></footer>
<div id="joystick"><div></div></div><div class="desktop-help">WASD 移动 · 鼠标瞄准 · 按住左键施法 · B 装备</div>
<dialog id="intro"><small class="eyebrow">原创暗黑风格 · 单人地下城</small><h1>余烬<span>法师</span></h1><p>踏入被遗忘的地窟。<br>以烈焰开路，以寒霜掌控命运。</p><div class="intro-features"><span>3D 俯视战斗</span><span>随机装备</span><span>本机成长存档</span></div><button class="primary" id="start" disabled>正在加载法师模型…</button><small id="savehint">手机使用左侧摇杆移动，右侧按住火球攻击</small></dialog>
<dialog id="character"><small class="eyebrow">余烬学徒 / 人物</small><h2>守望火种的人</h2><canvas id="model-preview" aria-label="可旋转的法师 3D 模型"></canvas><p class="model-note">拖动旋转 · 银发、衣袍、法杖与骨骼动作</p><button class="primary" id="closehero">回到地窟</button></dialog>
<dialog id="inventory"><small class="eyebrow">角色 / 装备</small><h2>法师的行囊</h2><p id="stats"></p><div id="items"></div><button class="primary" id="closebag">继续冒险</button></dialog>
<dialog id="result"><small class="eyebrow" id="resulttag"></small><h2 id="resulttitle"></h2><p id="resultdesc"></p><button class="primary" id="retry">再次进入地窟 →</button></dialog><script type="module" src="game.js"></script></body></html>
